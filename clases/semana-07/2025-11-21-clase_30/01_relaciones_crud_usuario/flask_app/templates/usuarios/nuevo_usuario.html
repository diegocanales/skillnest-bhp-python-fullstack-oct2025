<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Agregar un usuario</h2>

    <form action="/usuarios/crear" method="POST">
        {% with messages = get_flashed_messages(category_filter=["email"]) %}
            {% if messages %}
                {% for message in messages %}
                    <p class="error-correo">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <label>Nombre:</label>
        <input type="text" name="nombre"><br>

        <label>Apellido:</label>
        <input type="text" name="apellido"><br>

        <label>Email:</label>
        <input type="text" name="email"><br> <!-- forzado a ser un campo tipo texto para comprobar validación con regex -->

        <label>Edad:</label>
        <input type="number" name="edad"><br>

        <input type="submit" value="Crear usuario">
    </form>
    
</body>
</html>
