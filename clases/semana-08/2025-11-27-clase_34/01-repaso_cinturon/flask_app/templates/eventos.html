<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Evento</th>
                <th>Ubicación</th>
                <th>Fecha</th>
                <th>Publicado por</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for evento in eventos %}
            <tr>
                <td>{{ evento.evento }}</td>
                <td>{{ evento.ubicacion }}</td>
                <td>{{ evento.fecha }}</td>
                <td>{{ evento.usuario_nombre }}</td>
                <td>
                    <a href="/eventos/{{evento.id}}">Ver</a> |
                    <!-- TODO: implementar mostrar botones de editar y eliminar solo si el usuario de la sesion creo el evento -->
                    <a href="/eventos/editar/{{evento.id}}">Editar</a> |
                    <form action="/eventos/eliminar/{{evento.id}}" method="POST" style="display: inline;">
                        <input type="submit" value="Eliminar" onclick="return confirm('¿Estás seguro?');">
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

</html>
